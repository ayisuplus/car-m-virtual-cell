# ============================================================
# CAR-M Virtual Cell Simulator — Cloudflare Pages 自动部署
# 触发条件：
#   - push 到 main           → 生产部署（environment: production）
#   - PR 到 main             → 预览部署（environment: preview，branch=pr-<编号>）
#   - workflow_dispatch      → 手动触发（按当前 ref 分支判断生产/预览）
# 流程：构建（含 slides 同步）→ wrangler 部署到 Cloudflare Pages → 生产健康检查
# 生产地址：https://car-m-virtual-cell.pages.dev
#
# 所需 Secrets（在 GitHub → Settings → Secrets and variables）：
#   CLOUDFLARE_API_TOKEN   —— Cloudflare API Token（需 Pages:Edit 权限）
#   CLOUDFLARE_ACCOUNT_ID  —— Cloudflare 账户 ID
# ============================================================

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]   # 触发预览部署
  workflow_dispatch:   # 允许手动触发

concurrency:
  group: deploy-cf
  cancel-in-progress: false   # 部署串行执行，避免互相覆盖

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    permissions:
      contents: read
      deployments: write

    defaults:
      run:
        working-directory: app

    steps:
      # ---- 1. 检出代码 ----
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 2. 设置 Node.js + 缓存 ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ---- 3. 安装依赖 ----
      - name: Install dependencies
        run: npm ci

      # ---- 4. 生产构建（vite 插件会自动同步 slides/ 到 dist/slides/） ----
      - name: Build
        run: npm run build

      # ---- 5. 校验构建产物完整性 ----
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html 缺失"; exit 1; }
          test -f dist/slides/index.html || { echo "❌ dist/slides/index.html 缺失"; exit 1; }
          echo "✅ 构建产物完整"
          du -sh dist/

      # ---- 6. 生产部署（仅 push main / 手动触发 main） ----
      # 安全守卫：fork 分支的 PR 不执行涉及 Secrets 的部署步骤
      - name: Deploy to Cloudflare Pages (production)
        if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=car-m-virtual-cell --branch=main

      # ---- 6b. 预览部署（仅 PR 触发，branch=pr-<编号>） ----
      # 安全守卫：仅同仓库（非 fork）PR 执行
      - name: Deploy to Cloudflare Pages (preview)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=car-m-virtual-cell --branch=pr-${{ github.event.pull_request.number }}

      # ---- 7. 生产健康检查（仅生产部署执行） ----
      - name: Health check (production)
        if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          curl -sf https://car-m-virtual-cell.pages.dev/ -o /dev/null  || { echo "❌ 根路径健康检查失败"; exit 1; }
          curl -sf https://car-m-virtual-cell.pages.dev/slides/ -o /dev/null || { echo "❌ /slides/ 健康检查失败"; exit 1; }
          echo "✅ 生产部署健康检查通过"
