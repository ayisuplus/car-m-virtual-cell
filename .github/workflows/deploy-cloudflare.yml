# ============================================================
# CAR-M Virtual Cell Simulator — Cloudflare Pages 自动部署
# 触发条件：push 到 main / 手动触发
# 流程：构建（含 slides 同步）→ wrangler 部署到 Cloudflare Pages
# 生产地址：https://car-m-virtual-cell.pages.dev
#
# 所需 Secrets（在 GitHub → Settings → Secrets and variables）：
#   CLOUDFLARE_API_TOKEN   —— Cloudflare API Token（需 Pages:Edit 权限）
#   CLOUDFLARE_ACCOUNT_ID  —— Cloudflare 账户 ID
# ============================================================

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # 允许手动触发

concurrency:
  group: deploy-cf
  cancel-in-progress: false   # 部署串行执行，避免互相覆盖

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    defaults:
      run:
        working-directory: app

    steps:
      # ---- 1. 检出代码 ----
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 2. 设置 Node.js + 缓存 ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ---- 3. 安装依赖 ----
      - name: Install dependencies
        run: npm ci

      # ---- 4. 生产构建（vite 插件会自动同步 slides/ 到 dist/slides/） ----
      - name: Build
        run: npm run build

      # ---- 5. 校验构建产物完整性 ----
      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "❌ dist/index.html 缺失"; exit 1; }
          test -f dist/slides/index.html || { echo "❌ dist/slides/index.html 缺失"; exit 1; }
          echo "✅ 构建产物完整"
          du -sh dist/

      # ---- 6. 部署到 Cloudflare Pages ----
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: app
          command: pages deploy dist --project-name=car-m-virtual-cell --branch=main
