# ============================================================
# CAR-M Virtual Cell Simulator — CI 工作流
# 触发条件：push 到任意分支 / PR 到 main
# 执行：类型检查 → 代码检查 → 行为级测试 → 构建验证
# ============================================================

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:      # 允许手动触发

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]   # 当前开发使用的版本；可加 20.x 做兼容性矩阵

    defaults:
      run:
        working-directory: app

    steps:
      # ---- 1. 检出代码 ----
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 2. 设置 Node.js + 缓存 ----
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ---- 3. 安装依赖 ----
      - name: Install dependencies
        run: npm ci

      # ---- 4. TypeScript 类型检查 ----
      - name: Type check
        run: npx tsc -b --noEmit 2>&1 || npx tsc --noEmit 2>&1

      # ---- 5. ESLint 代码检查 ----
      - name: Lint
        run: npm run lint

      # ---- 6. 行为级检查（surrogate 一致性 + 仿真核心单元测试） ----
      - name: Test
        run: npm test

      # ---- 7. 生产构建 ----
      - name: Build
        run: npm run build

      # ---- 8. 检查构建产物完整性 ----
      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "❌ dist/index.html 缺失，构建可能失败"
            exit 1
          fi
          echo "✅ 构建产物检查通过"
          echo "📦 构建大小:"
          du -sh dist/

      # ---- 9. 上传构建产物（供 deploy workflow 复用） ----
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output-${{ github.sha }}
          path: app/dist/
          retention-days: 3

  # ============================================================
  # E2E 测试任务（与 lint-and-build 并行运行）
  # ============================================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    defaults:
      run:
        working-directory: app

    steps:
      # ---- 1. 检出代码 ----
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 2. 设置 Node.js + 缓存 ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ---- 3. 安装依赖 ----
      - name: Install dependencies
        run: npm ci

      # ---- 4. 安装 Playwright 浏览器（chromium + webkit，与 playwright.config.ts 的 projects 一致） ----
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # ---- 5. 构建生产版本 ----
      - name: Build
        run: npm run build

      # ---- 6. 运行 E2E 测试 ----
      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          CI: true

      # ---- 7. 上传测试报告 ----
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.sha }}
          path: app/playwright-report/
          retention-days: 7

      # ---- 8. 上传测试结果（失败时） ----
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ github.sha }}
          path: app/test-results/
          retention-days: 7
